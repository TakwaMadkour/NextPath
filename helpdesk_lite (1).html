<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HelpDesk Lite — V1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B1F23; --paper:#F5F4EF; --surface:#FFFFFF; --line:#E4E1D8;
    --muted:#767268; --accent:#2D5F5A; --accent-dark:#244B47; --accent-soft:#DCE8E6;
    --p-low:#767268; --p-med:#3A5A8C; --p-high:#B8792F; --p-urgent:#C1502E;
    --s-new:#767268; --s-assigned:#3A5A8C; --s-progress:#8A6D1D; --s-resolved:#2D5F5A; --s-closed:#1B1F23;
    --shadow-sm: 0 1px 2px rgba(27,31,35,.05);
    --shadow-md: 0 6px 20px rgba(27,31,35,.08);
    --shadow-lg: 0 16px 40px rgba(27,31,35,.16);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);
    -webkit-font-smoothing:antialiased;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .muted{color:var(--muted);}
  .small{font-size:12px;}
  .app{display:grid;grid-template-columns:248px 1fr;min-height:100vh;}

  @keyframes fadeUp{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes popIn{ from{opacity:0; transform:scale(.96);} to{opacity:1; transform:scale(1);} }
  .fade-content{animation:fadeUp .32s cubic-bezier(.2,.8,.2,1);}
  .stagger > *{animation:fadeUp .35s cubic-bezier(.2,.8,.2,1) backwards;}

  /* Sidebar */
  .sidebar{
    background:radial-gradient(120% 140% at 0% 0%, #24292F 0%, var(--ink) 55%);
    color:var(--paper);padding:22px 18px;display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;border-right:1px solid #0F1215;
  }
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:30px;}
  .brand-mark{
    width:36px;height:36px;border-radius:9px;
    background:linear-gradient(155deg,#3A7A73,var(--accent) 60%,var(--accent-dark));
    color:var(--paper);display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;
    box-shadow:0 3px 10px rgba(45,95,90,.5), inset 0 1px 0 rgba(255,255,255,.15);
  }
  .brand-name{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15.5px;letter-spacing:-.01em;}
  .sidebar .muted.small{color:#9C988C;}
  .role-nav{display:flex;flex-direction:column;gap:4px;margin-bottom:26px;}
  .role-btn{
    display:flex;align-items:center;gap:10px;background:transparent;border:none;color:#C9C6BC;
    padding:10px 11px;border-radius:8px;font-size:13.5px;text-align:left;cursor:pointer;font-family:inherit;
    transition:background .18s ease, color .18s ease, transform .12s ease;position:relative;
  }
  .role-btn:hover{background:#FFFFFF0D;color:#F5F4EF;}
  .role-btn:active{transform:scale(.98);}
  .role-btn svg{flex-shrink:0;}
  .role-active{background:var(--accent);color:var(--paper);box-shadow:var(--shadow-sm), 0 2px 10px rgba(45,95,90,.35);}
  .role-active:hover{background:var(--accent);}
  .role-count{
    margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:10.5px;
    background:#FFFFFF1A;padding:1px 6px;border-radius:20px;
  }
  .role-active .role-count{background:#FFFFFF2A;}

  .quick-stats{display:flex;flex-direction:column;gap:9px;padding:14px 12px;background:#FFFFFF08;
    border:1px solid #FFFFFF14;border-radius:10px;margin-bottom:22px;}
  .quick-stat-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#C9C6BC;}
  .quick-stat-row b{color:#F5F4EF;font-family:'IBM Plex Mono',monospace;font-weight:500;}

  .lifecycle-legend{border-top:1px solid #FFFFFF14;padding-top:16px;margin-top:auto;}
  .legend-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#C9C6BC;padding:3.5px 0;}
  .legend-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 3px currentColor22;}
  .sidebar-foot{display:flex;align-items:center;gap:6px;margin-top:16px;color:#8A8677;}

  /* Main */
  .main{display:flex;flex-direction:column;min-width:0;}
  .topbar{
    display:flex;justify-content:space-between;align-items:center;padding:16px 32px;
    border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:10;
  }
  .who-row{display:flex;align-items:center;gap:10px;}
  .who{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;letter-spacing:-.01em;}
  .topbar-right{display:flex;align-items:center;gap:14px;}
  .topbar-right .muted{display:flex;align-items:center;gap:6px;}

  .content{padding:30px 32px 60px;}

  .section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px;}
  .section-head h2{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:600;margin:0;letter-spacing:-.01em;}
  .section-sub{color:var(--muted);font-size:12.5px;margin-top:2px;}

  .grid-2{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:start;}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;
    box-shadow:var(--shadow-sm); transition:box-shadow .2s ease, border-color .2s ease;}
  .card-title{font-weight:600;font-size:13.5px;margin-bottom:14px;display:flex;align-items:center;gap:6px;}

  .form-card{display:flex;flex-direction:column;gap:13px;margin-bottom:18px;animation:popIn .22s cubic-bezier(.2,.8,.2,1);}
  .field{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:500;}
  .field-row{display:flex;gap:12px;}
  .field-row .field{flex:1;}
  input,textarea,select{
    font-family:'Inter',sans-serif;font-size:13.5px;padding:9px 11px;
    border:1px solid var(--line);border-radius:7px;background:#FBFAF7;color:var(--ink);width:100%;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px #2D5F5A22;}
  textarea{resize:vertical;font-family:inherit;}
  select{cursor:pointer;}

  .btn-primary{
    display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:var(--paper);
    border:none;padding:10px 15px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;
    box-shadow:0 2px 8px rgba(45,95,90,.28); transition:background .15s ease, transform .1s ease, box-shadow .15s ease;
  }
  .btn-primary:hover{background:var(--accent-dark);box-shadow:0 4px 14px rgba(45,95,90,.36);}
  .btn-primary:active{transform:scale(.97);}
  .btn-ghost{
    background:transparent;border:1px solid var(--line);border-radius:7px;padding:8px 13px;
    font-size:12.5px;cursor:pointer;font-family:inherit;font-weight:500;color:var(--ink);
    transition:border-color .15s ease, background .15s ease;
  }
  .btn-ghost:hover{border-color:var(--accent);background:var(--accent-soft);}

  .ticket-list{display:flex;flex-direction:column;gap:9px;}
  .ticket-row{
    display:flex;justify-content:space-between;align-items:center;background:var(--surface);
    border:1px solid var(--line);border-left:3px solid var(--line);border-radius:10px;padding:13px 15px;cursor:pointer;
    transition:border-color .15s ease, box-shadow .18s ease, transform .12s ease;
  }
  .ticket-row:hover{border-color:var(--accent);box-shadow:var(--shadow-md);transform:translateY(-1px);}
  .ticket-row-left{display:flex;align-items:center;gap:12px;min-width:0;}
  .ticket-row-right{display:flex;align-items:center;gap:10px;}
  .ticket-title{font-size:13.5px;font-weight:500;margin-top:2px;}
  .ticket-meta-line{display:flex;align-items:center;gap:6px;margin-top:3px;}

  .avatar{
    width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk',sans-serif;font-size:10.5px;font-weight:700;color:#fff;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.25);
  }
  .avatar.sm{width:20px;height:20px;font-size:9px;}

  .pill{border:1px solid;border-radius:20px;padding:3px 10px;font-size:11.5px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;}
  .pill-dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
  .age-tag{font-size:11px;color:var(--muted);display:inline-flex;align-items:center;gap:4px;}
  .age-tag.warn{color:var(--p-urgent);font-weight:600;}

  .search-box{
    display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;
    padding:8px 11px;background:#FBFAF7;margin-bottom:12px;transition:border-color .15s ease, box-shadow .15s ease;
  }
  .search-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px #2D5F5A22;}
  .search-box input{border:none;background:transparent;flex:1;padding:0;}
  .search-box input:focus{outline:none;box-shadow:none;}
  .search-box svg{flex-shrink:0;color:var(--muted);}

  .kb-list{display:flex;flex-direction:column;gap:13px;}
  .kb-item{border-top:1px solid #EFEDE6;padding-top:11px;transition:transform .15s ease;}
  .kb-item:hover{transform:translateX(2px);}
  .kb-item:first-child{border-top:none;padding-top:0;}
  .kb-title{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px;margin-bottom:3px;}
  .kb-title svg{color:var(--accent);flex-shrink:0;}

  .filter-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .filter-bar .search-box{margin-bottom:0;flex:1;min-width:180px;}
  .filter-bar select{min-width:126px;width:auto;}

  .table{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow-sm);}
  .table-head,.table-row{display:grid;grid-template-columns:2.2fr 0.9fr 1fr 1.1fr 1fr;padding:13px 18px;align-items:center;gap:10px;}
  .table-head{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line);background:#FBFAF7;}
  .th-sort{cursor:pointer;display:flex;align-items:center;gap:4px;user-select:none;}
  .th-sort:hover{color:var(--ink);}
  .th-sort svg{opacity:.5;transition:opacity .15s ease, transform .15s ease;}
  .th-sort.active svg{opacity:1;color:var(--accent);}
  .th-sort.desc svg{transform:rotate(180deg);}
  .table-row{border-bottom:1px solid #EFEDE6;cursor:pointer;font-size:13.5px;border-left:3px solid transparent;transition:background .15s ease, border-color .15s ease;}
  .table-row:last-child{border-bottom:none;}
  .table-row:hover{background:#FBFAF7;}
  .owner-cell{display:flex;align-items:center;gap:8px;}

  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:22px;}
  .stat-card{
    background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;
    box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
  }
  .stat-card::after{content:"";position:absolute;top:0;left:0;width:4px;height:100%;background:var(--stat-accent,var(--accent));}
  .stat-num{font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:700;margin-top:6px;letter-spacing:-.02em;}
  .stat-foot{font-size:11.5px;color:var(--muted);margin-top:4px;}

  .bar-row{display:grid;grid-template-columns:112px 1fr 26px;align-items:center;gap:10px;margin-bottom:11px;}
  .bar-label{font-size:12.5px;display:flex;align-items:center;gap:7px;}
  .bar-track{background:#EFEDE6;border-radius:6px;height:8px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:6px;transition:width .6s cubic-bezier(.2,.8,.2,1);width:0;}

  .donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap;}
  .donut-legend{display:flex;flex-direction:column;gap:9px;flex:1;min-width:150px;}
  .donut-legend-row{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;}
  .donut-legend-left{display:flex;align-items:center;gap:8px;}
  .donut-legend-dot{width:8px;height:8px;border-radius:2px;}

  .flag-row{display:flex;align-items:center;gap:11px;padding:9px 0;border-top:1px solid #EFEDE6;font-size:13px;}
  .flag-row:first-of-type{border-top:none;}

  .empty{color:var(--muted);font-size:13px;padding:22px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;}
  .empty svg{opacity:.35;}

  .rail{display:flex;align-items:center;margin:18px 0 20px;}
  .rail-node{display:flex;flex-direction:column;align-items:center;gap:6px;width:76px;}
  .rail-dot{width:11px;height:11px;border-radius:50%;background:var(--line);border:2px solid var(--line);transition:all .2s ease;}
  .rail-node.done .rail-dot{background:var(--accent);border-color:var(--accent);}
  .rail-node.current .rail-dot{background:var(--surface);border-color:var(--accent);box-shadow:0 0 0 4px #2D5F5A26;transform:scale(1.15);}
  .rail-label{font-size:10.5px;color:var(--muted);text-align:center;}
  .rail-node.done .rail-label,.rail-node.current .rail-label{color:var(--ink);font-weight:600;}
  .rail-line{flex:1;height:2px;background:var(--line);margin-bottom:17px;position:relative;overflow:hidden;}
  .rail-line.done{background:var(--accent);}

  .drawer-overlay{
    position:fixed;inset:0;background:#1B1F2380;backdrop-filter:blur(2px);display:flex;justify-content:flex-end;z-index:50;
    opacity:0;pointer-events:none;transition:opacity .22s ease;
  }
  .drawer-overlay.open{opacity:1;pointer-events:auto;}
  .drawer{width:452px;max-width:92vw;background:var(--paper);height:100%;overflow-y:auto;padding:28px;
    transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow-lg);}
  .drawer-overlay.open .drawer{transform:translateX(0);}
  .drawer-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;}
  .drawer-id-row{display:flex;align-items:center;gap:8px;}
  .drawer-head h3{font-family:'Space Grotesk',sans-serif;font-size:19px;margin:5px 0 0;letter-spacing:-.01em;}
  .icon-btn{background:transparent;border:none;cursor:pointer;color:var(--muted);padding:5px;border-radius:6px;transition:background .15s ease, color .15s ease;}
  .icon-btn:hover{color:var(--ink);background:#00000008;}
  .copy-btn{background:transparent;border:none;cursor:pointer;color:var(--muted);padding:2px;display:inline-flex;transition:color .15s ease;}
  .copy-btn:hover{color:var(--accent);}
  .drawer-tags{display:flex;align-items:center;gap:8px;margin:11px 0 4px;flex-wrap:wrap;}
  .drawer-desc{font-size:13.5px;line-height:1.55;color:#3A3833;margin:8px 0 18px;}
  .drawer-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px;font-size:13px;}
  .drawer-meta > div{display:flex;flex-direction:column;gap:5px;}
  .drawer-meta-person{display:flex;align-items:center;gap:6px;}
  .drawer-actions{display:flex;flex-direction:column;gap:15px;margin-bottom:22px;background:#FBFAF7;border:1px solid var(--line);border-radius:10px;padding:14px;}
  .action-group{display:flex;flex-direction:column;gap:8px;}
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{
    border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 12px;
    font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s ease;display:inline-flex;align-items:center;gap:5px;
  }
  .chip:hover{border-color:var(--accent);}
  .chip-active{background:var(--accent);color:var(--paper);border-color:var(--accent);}
  .drawer-section{margin-bottom:22px;}
  .drawer-section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .history-list{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:0;position:relative;}
  .history-list li{display:flex;align-items:flex-start;gap:10px;font-size:12.5px;color:#3A3833;padding:6px 0;position:relative;}
  .history-list li:not(:last-child)::before{content:"";position:absolute;left:5px;top:20px;bottom:-6px;width:1px;background:var(--line);}
  .history-dot{width:11px;height:11px;border-radius:50%;background:var(--accent);flex-shrink:0;margin-top:2px;box-shadow:0 0 0 3px #2D5F5A1A;}
  .comment{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:12.5px;margin-top:8px;line-height:1.5;animation:fadeUp .25s ease;}
  .comment-input{display:flex;gap:8px;margin-top:11px;}
  .comment-input input{flex:1;}

  /* Toasts */
  .toast-stack{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:10px;z-index:100;}
  .toast{
    background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:9px;font-size:13px;
    display:flex;align-items:center;gap:9px;box-shadow:var(--shadow-lg);animation:toastIn .25s cubic-bezier(.2,.8,.2,1);
    max-width:320px;
  }
  .toast svg{flex-shrink:0;color:#7FD1B9;}
  @keyframes toastIn{ from{opacity:0; transform:translateY(10px) scale(.95);} to{opacity:1; transform:translateY(0) scale(1);} }
  .toast.leaving{animation:toastOut .2s ease forwards;}
  @keyframes toastOut{ to{opacity:0; transform:translateX(20px);} }

  svg{display:block;}
  ::selection{background:#2D5F5A33;}

  @media (max-width: 860px){
    .app{grid-template-columns:1fr;}
    .sidebar{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto;gap:20px;}
    .quick-stats,.lifecycle-legend,.sidebar-foot{display:none;}
    .content{padding:20px 16px;}
    .grid-2{grid-template-columns:1fr;}
    .stat-row{grid-template-columns:1fr;}
    .table-head,.table-row{grid-template-columns:1.6fr 0.8fr 1fr;}
    .table-head span:nth-child(4),.table-head span:nth-child(5),
    .table-row span:nth-child(4),.table-row span:nth-child(5){display:none;}
    .toast-stack{left:16px;right:16px;bottom:16px;}
    .toast{max-width:none;}
  }
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">HD</div>
      <div>
        <div class="brand-name">HelpDesk Lite</div>
        <div class="muted small">V1 · internal</div>
      </div>
    </div>

    <nav class="role-nav" id="roleNav"></nav>

    <div class="quick-stats" id="quickStats"></div>

    <div class="lifecycle-legend">
      <div class="muted small" style="margin-bottom:9px;">Ticket lifecycle</div>
      <div id="legendList"></div>
    </div>

    <div class="sidebar-foot muted small">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/></svg>
      Role-based access · V1 scope
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="who-row">
        <div id="topAvatar"></div>
        <div>
          <div class="muted small">Signed in as</div>
          <div class="who" id="whoLabel"></div>
        </div>
      </div>
      <div class="topbar-right muted small">
        <span class="muted">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span id="totalCount"></span>
        </span>
      </div>
    </header>

    <div class="content" id="content"></div>
  </main>

</div>

<div class="drawer-overlay" id="drawerOverlay">
  <div class="drawer" id="drawer"></div>
</div>

<div class="toast-stack" id="toastStack"></div>

<script>
/* ---------------------------------------------------------
   Data model
--------------------------------------------------------- */
const STATUSES = ["New", "Assigned", "In Progress", "Resolved", "Closed"];
const PRIORITIES = ["Low", "Medium", "High", "Urgent"];
const CATEGORIES = ["Access", "Hardware", "Software", "Network", "HR Systems", "Other"];
const AGENTS = ["Dara Osei", "Malik Reyes", "Priya Nair"];
const EMPLOYEE_NAME = "Sam Whitfield";
const TODAY = new Date("2026-08-20T09:00:00");

const priorityColor = { Low:"#767268", Medium:"#3A5A8C", High:"#B8792F", Urgent:"#C1502E" };
const statusColor = { New:"#767268", Assigned:"#3A5A8C", "In Progress":"#8A6D1D", Resolved:"#2D5F5A", Closed:"#1B1F23" };
const avatarPalette = ["#2D5F5A","#3A5A8C","#B8792F","#7A4FA0","#B8506E","#4C7A3F","#8A6D1D"];

const KB_ARTICLES = [

/* ---------------------------------------------------------
   Helpers
--------------------------------------------------------- */
function findTicket(id){ return state.tickets.find(t => t.id === id); }
function esc(str){ const d = document.createElement("div"); d.textContent = str ?? ""; return d.innerHTML; }
function pill(color, text, dot){
  return `<span class="pill" style="color:${color};border-color:${color}55;background:${color}14;">${dot?`<span class="pill-dot"></span>`:""}${text}</span>`;
}
function hashColor(name){
  let h = 0;
  for (let i=0;i<name.length;i++) h = name.charCodeAt(i) + ((h<<5)-h);
  return avatarPalette[Math.abs(h) % avatarPalette.length];
}
function initials(name){
  return name.split(" ").map(p=>p[0]).slice(0,2).join("").toUpperCase();
}
function avatar(name, size="md"){
  if (!name) return `<div class="avatar ${size==='sm'?'sm':''}" style="background:#D8D5CB;color:#767268;">?</div>`;
  return `<div class="avatar ${size==='sm'?'sm':''}" style="background:${hashColor(name)};">${initials(name)}</div>`;
}
function daysOpen(createdAt){
  const d = new Date(createdAt.replace(" ","T"));
  return Math.max(0, Math.round((TODAY - d) / 86400000));
}
function ageTag(t){
  if (t.status === "Resolved" || t.status === "Closed") return "";
  const d = daysOpen(t.createdAt);
  const warn = d >= 2 && (t.priority === "High" || t.priority === "Urgent");
  return `<span class="age-tag ${warn?'warn':''}">${warn?ICONS.alert:""} ${d===0?"today":d+"d open"}</span>`;
}

/* Toasts */
function toast(message, iconKey="check"){
  const stack = document.getElementById("toastStack");
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `${ICONS[iconKey] || ICONS.check} <span>${esc(message)}</span>`;
  stack.appendChild(el);
  setTimeout(() => {
    el.classList.add("leaving");
    setTimeout(() => el.remove(), 220);
  }, 2600);
}

/* Count-up animation */
function animateCount(el, to, duration=650){
  const from = 0;
  const start = performance.now();
  function step(now){
    const p = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(from + (to - from) * eased);
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ---------------------------------------------------------
   Lifecycle rail
--------------------------------------------------------- */
function railHTML(status){
  const idx = STATUSES.indexOf(status);
  let out = '<div class="rail">';
  STATUSES.forEach((s, i) => {
    const cls = `${i <= idx ? "done" : ""} ${i === idx ? "current" : ""}`;
    out += `<div class="rail-node ${cls}"><span class="rail-dot"></span><span class="rail-label">${s}</span></div>`;
    if (i < STATUSES.length - 1) out += `<span class="rail-line ${i < idx ? "done" : ""}"></span>`;
  });
  out += '</div>';
  return out;
}

/* ---------------------------------------------------------
   Manager view — status donut + workload bars
--------------------------------------------------------- */
function donutSVG(byStatus, total){
  const size = 152, stroke = 20, r = (size - stroke) / 2, c = 2 * Math.PI * r;
  let offset = 0;
  const segments = byStatus.filter(b => b.count > 0).map(b => {
    const frac = b.count / total;
    const len = frac * c;
    const seg = `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${statusColor[b.status]}"
      stroke-width="${stroke}" stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-offset}"
      transform="rotate(-90 ${size/2} ${size/2})" stroke-linecap="butt" />`;
    offset += len;
    return seg;
  }).join("");
  return `
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#EFEDE6" stroke-width="${stroke}" />
      ${segments}
      <text x="${size/2}" y="${size/2 - 4}" text-anchor="middle" font-family="Space Grotesk" font-size="26" font-weight="700" fill="#1B1F23">${total}</text>
      <text x="${size/2}" y="${size/2 + 16}" text-anchor="middle" font-family="Inter" font-size="11" fill="#767268">tickets</text>
    </svg>
  `;
}

  document.querySelectorAll(".stat-num[data-count]").forEach(el => animateCount(el, parseInt(el.dataset.count, 10)));
  requestAnimationFrame(() => {
    document.querySelectorAll(".bar-fill[data-width]").forEach(el => {
      el.style.width = el.dataset.width + "%";
    });
  });
}

/* ---------------------------------------------------------
   Drawer
--------------------------------------------------------- */
function openDrawer(id){
  state.selectedId = id;
  renderDrawer();
  document.getElementById("drawerOverlay").classList.add("open");
}
function closeDrawer(){
  document.getElementById("drawerOverlay").classList.remove("open");
  state.selectedId = null;
}
function renderDrawer(){
  const t = findTicket(state.selectedId);
  const drawer = document.getElementById("drawer");
  if (!t){ drawer.innerHTML = ""; return; }

  drawer.innerHTML = `
    <div class="drawer-head">
      <div>
        <div class="drawer-id-row">
          <span class="mono muted small">${t.id}</span>
          <button class="copy-btn" id="copyIdBtn" title="Copy ticket ID">${ICONS.copy}</button>
        </div>
        <h3>${esc(t.title)}</h3>
      </div>
      <button class="icon-btn" id="closeDrawerBtn">${ICONS.x}</button>
    </div>

    <div class="drawer-tags">
      ${pill(priorityColor[t.priority], t.priority)}
      ${pill(statusColor[t.status], t.status, true)}
      <span class="muted small">${t.category}</span>
      ${ageTag(t)}
    </div>

    ${railHTML(t.status)}

    <p class="drawer-desc">${esc(t.description) || "<span class='muted'>No description provided.</span>"}</p>

    <div class="drawer-meta">
      <div><span class="muted small">Requester</span><div class="drawer-meta-person">${avatar(t.requester,"sm")}${esc(t.requester)}</div></div>
      <div><span class="muted small">Created</span><div class="mono">${t.createdAt}</div></div>
      <div><span class="muted small">Owner</span><div class="drawer-meta-person">${t.assignedTo ? avatar(t.assignedTo,"sm")+esc(t.assignedTo) : "Unassigned"}</div></div>
    </div>

    ${state.role !== "Employee" ? `
    <div class="drawer-actions">
      <div class="action-group">
        <span class="muted small">Assign to</span>
        <div class="chip-row">
          ${AGENTS.map(a => `<button class="chip ${t.assignedTo===a?"chip-active":""}" data-assign="${esc(a)}">${avatar(a,"sm")}${esc(a)}</button>`).join("")}
        </div>
      </div>
      <div class="action-group">
        <span class="muted small">Move status</span>
        <div class="chip-row">
          ${STATUSES.map(s => `<button class="chip ${t.status===s?"chip-active":""}" data-status="${s}" style="${t.status===s?`background:${statusColor[s]};border-color:${statusColor[s]};`:""}">${s}</button>`).join("")}
        </div>
      </div>
    </div>` : ""}

    <div class="drawer-section">
      <div class="drawer-section-title"><span class="muted small">History</span></div>
      <ul class="history-list">
        ${t.history.map(h => `<li><span class="history-dot"></span> ${esc(h)}</li>`).join("")}
      </ul>
    </div>

    <div class="drawer-section">
      <span class="muted small">Notes</span>
      ${t.comments.map(c => `<div class="comment">${esc(c)}</div>`).join("")}
      <div class="comment-input">
        <input id="commentInput" placeholder="${state.role==='Employee' ? 'Add clarification…' : 'Add a resolution note…'}" />
        <button class="btn-ghost" id="addCommentBtn">Add</button>
      </div>
    </div>
  `;

  document.getElementById("closeDrawerBtn").addEventListener("click", closeDrawer);

  const copyBtn = document.getElementById("copyIdBtn");
  copyBtn.addEventListener("click", () => {
    if (navigator.clipboard) navigator.clipboard.writeText(t.id).catch(()=>{});
    toast(`${t.id} copied`);
  });

  document.querySelectorAll("[data-assign]").forEach(btn => {
    btn.addEventListener("click", () => {
      t.assignedTo = btn.dataset.assign;
      if (t.status === "New") t.status = "Assigned";
      t.history.push(`Assigned to ${btn.dataset.assign}`);
      renderDrawer();
      renderContent();
      toast(`${t.id} assigned to ${btn.dataset.assign}`);
    });
  });
  document.querySelectorAll("[data-status]").forEach(btn => {
    btn.addEventListener("click", () => {
      if (t.status === btn.dataset.status) return;
      t.status = btn.dataset.status;
      t.history.push(`Moved to ${btn.dataset.status}`);
      renderDrawer();
      renderContent();
      toast(`${t.id} moved to ${btn.dataset.status}`);
    });
  });
  const addBtn = document.getElementById("addCommentBtn");
  const input = document.getElementById("commentInput");
  const submitComment = () => {
    const val = input.value.trim();
    if (!val) return;
    t.comments.push(val);
    renderDrawer();
    toast("Note added");
  };
  addBtn.addEventListener("click", submitComment);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") submitComment(); });
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && document.getElementById("drawerOverlay").classList.contains("open")) closeDrawer();
});

/* ---------------------------------------------------------
   Root render
--------------------------------------------------------- */
function renderContent(){
  const content = document.getElementById("content");
  content.classList.remove("fade-content");
  void content.offsetWidth;
  content.classList.add("fade-content");

  if (state.role === "Employee"){
    content.innerHTML = renderEmployee();
    bindEmployeeEvents();
  } else if (state.role === "Support"){
    content.innerHTML = renderSupport();
    bindSupportEvents();
  } else {
    content.innerHTML = renderManager();
    animateManagerVisuals();
  }
  document.getElementById("totalCount").textContent = `${state.tickets.length} total tickets`;
}

function render(){
  renderSidebar();
  renderContent();
}

render();
</script>
</body>
</html>
